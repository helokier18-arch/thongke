services:
  - type: web
    name: maritime-vessel-statistics
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DB_NAME
        value: maritime_statistics
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: API_AUTH_USERNAME
        sync: false
      - key: API_AUTH_PASSWORD
        sync: false
